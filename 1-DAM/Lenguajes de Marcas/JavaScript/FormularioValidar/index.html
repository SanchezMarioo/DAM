<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js"></script>
  </head>
  <body>
    <main id="main">
      <div class="form-container" id="form">
        <form action="" >
          <div class="form-header">
            <h2>Formulario</h2>
          </div>
          <div class="form-body">
            <div class="form-div">
              <label id="validarURL">Pagina web</label>
              <input
                type="text"
                name=""
                id="url"
                placeholder="Ponga aqui la URL"
              />
            </div>
            <div class="form-div">
              <label>Colores</label>
              <select name="" id="colores">
                <option>Selecciona una opcion</option>
                <option value="azul">Azul</option>
                <option value="blanco">Blanco</option>
                <option value="rojo">Rojo</option>
              </select>
            </div>
            <div class="form-div">
              <label id="cantidadText">Cantidad</label>
              <input
                type="number"
                name=""
                id="cantidad"
                placeholder="Introduce un numero"
              />
            </div>
          </div>
        </form>
        <div class="form-footer">
          <button id="btnCambiarColor">Cambiar</button>
          <button id="redirect">Ir a</button>
        </div>
      </div>
    </main>
  </body>
</html>
